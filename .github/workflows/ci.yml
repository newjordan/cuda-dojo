name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ensure a C++ compiler is installed
        run: |
          if ! command -v g++ >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends g++
          fi
          g++ --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build and run host engine tests
        run: make -C cuda/engine host-test

      - name: Run pytest
        run: python -m pytest -q -rs

      - name: Syntax-check Python
        run: python -m compileall -q compression crawler_control cuda tools gpu_spine tests

      - name: Syntax-check JavaScript
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f \( -name '*.js' -o -name '*.mjs' \) \
            -not -path './node_modules/*' -not -path './.venv/*' -print0)
